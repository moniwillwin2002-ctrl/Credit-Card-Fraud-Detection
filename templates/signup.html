{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block body %}
<section class="page-banner"><div class="container"><h1>Create Account</h1><p>Register to use the project.</p></div></section>
<div class="container py-5"><div class="form-card mx-auto">
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-info w-100">Create Account</button></form></div></div>
{% endblock %}
