{% extends "base.html" %}
{% block title %}Apply for Credit Card{% endblock %}
{% block body %}<section class="page-banner"><div class="container"><h1>Apply for a Credit Card</h1><p>Fill in your application details.</p></div></section><div class="container py-5"><div class="form-card mx-auto"><form method="post">{% csrf_token %}
<label class="form-label">Full Name</label><input class="form-control mb-3" name="full_name" required>
<label class="form-label">Age</label><input class="form-control mb-3" type="number" min="18" name="age" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Annual Income</label><input class="form-control mb-4" type="number" step="0.01" min="0" name="income" required>
<button class="btn btn-info w-100">Submit Application</button></form></div></div>{% endblock %}
